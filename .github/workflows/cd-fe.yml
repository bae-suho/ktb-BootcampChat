name: CD Frontend

on:
  push:
    branches:
      - deploy
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/cd-fe.yml'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: ktb-bootcamp-chat-frontend
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}

concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: vars
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "🏷️ Version: ${SHORT_SHA}"

      # 1. Docker Build & Push를 위한 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Docker Build & Push 실행 (캐시 옵션 제거됨)
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short-sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 400 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile /dev/null
          EOF

      - name: Deploy to EC2 instance
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.short-sha }}
          SSH_USER: ${{ secrets.EC2_SSH_USER }}
          HOST_IP: ${{ secrets.EC_INSTANCE_FE2 }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
        run: |
          echo "🚀 Starting deployment to $HOST_IP..."

          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 ${SSH_USER}@${HOST_IP} \
            DOCKER_IMAGE="${DOCKER_USERNAME}/${IMAGE_NAME}:latest" \
            API_URL="${NEXT_PUBLIC_API_URL}" \
            SOCKET_URL="${NEXT_PUBLIC_SOCKET_URL}" \
            bash << 'ENDSSH'
            set -e
            mkdir -p ~/ktb-frontend && cd ~/ktb-frontend

            # 환경변수 파일 생성
            echo "⚙️  Creating environment file..."
            ENV_FILE=".env.local"
            touch $ENV_FILE
          
            > $ENV_FILE
            echo "NEXT_PUBLIC_API_URL=${API_URL}" >> $ENV_FILE
            echo "NEXT_PUBLIC_SOCKET_URL=${SOCKET_URL}" >> $ENV_FILE
          
            echo "📄 Environment file created:"
            cat $ENV_FILE

            echo "📦 Pulling image: $DOCKER_IMAGE"
            docker pull "$DOCKER_IMAGE"

            # 기존 컨테이너 중지
            OLD=$(docker ps -q -f name=ktb-frontend) || true
            if [ ! -z "$OLD" ]; then
              echo "🛑 Stopping old container: $OLD"
              docker stop ktb-frontend 2>/dev/null || true
              docker rm ktb-frontend 2>/dev/null || true
            fi

            echo "🚀 Starting container..."
            docker run -d --name ktb-frontend --restart unless-stopped \
              -p 3000:3000 \
              --env-file $ENV_FILE \
              --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
              "$DOCKER_IMAGE"

            # 헬스 체크
            echo "🏥 Health checking..."
            sleep 10
            for i in {1..30}; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || echo "000")
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
                echo "✅ Deployment Successful! (Status: $HTTP_CODE)"
                docker image prune -af --filter "until=72h" || true
                exit 0
              fi
              echo "⏳ Waiting for service... ($i/30)"
              sleep 2
            done

            # 롤백
            echo "❌ Deployment Failed. Rolling back..."
            docker stop ktb-frontend && docker rm ktb-frontend
            if [ ! -z "$OLD" ]; then
              echo "🔄 Restoring old container..."
              docker start $OLD || true
            fi
            exit 1
          ENDSSH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key