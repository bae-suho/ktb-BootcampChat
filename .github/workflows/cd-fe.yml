name: CD Frontend

on:
  push:
    branches:
      - deploy
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/cd-fe.yml'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: ktb-bootcamp-chat-frontend
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}

concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: vars
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "🏷️ Version: ${SHORT_SHA}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 instances from Target Group
        id: get-instances
        run: |
          echo "🔍 Fetching instances from Target Group: ${{ secrets.FRONTEND_TARGET_GROUP_NAME }}"

          TG_ARN=$(aws elbv2 describe-target-groups \
            --names ${{ secrets.FRONTEND_TARGET_GROUP_NAME }} \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)

          INSTANCE_IDS=$(aws elbv2 describe-target-health \
            --target-group-arn $TG_ARN \
            --query 'TargetHealthDescriptions[].Target.Id' \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "⚠️ No healthy instances found"
            exit 1
          fi

          PUBLIC_IPS=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_IDS \
            --query 'Reservations[].Instances[].PublicIpAddress' \
            --output text)

          echo "✅ Found $(echo $INSTANCE_IDS | wc -w) instances"
          echo "instance-ips=$PUBLIC_IPS" >> $GITHUB_OUTPUT
          echo "instance-ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
          echo "tg-arn=$TG_ARN" >> $GITHUB_OUTPUT

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 400 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile /dev/null
          EOF

      - name: Deploy to EC2 instances
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.short-sha }}
          SSH_USER: ${{ secrets.EC2_SSH_USER }}
          INSTANCE_IPS: ${{ steps.get-instances.outputs.instance-ips }}
          INSTANCE_IDS: ${{ steps.get-instances.outputs.instance-ids }}
          TG_ARN: ${{ steps.get-instances.outputs.tg-arn }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
        run: |
          echo "🚀 Starting deployment..."

          IPS=($INSTANCE_IPS)
          IDS=($INSTANCE_IDS)
          TOTAL=${#IPS[@]}
          SUCCESS=0

          for i in "${!IPS[@]}"; do
            IP=${IPS[$i]}
            ID=${IDS[$i]}

            echo ""
            echo "📦 Instance $((i+1))/$TOTAL: $ID ($IP)"

            if ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 ${SSH_USER}@${IP} << 'ENDSSH'
              set -e
              mkdir -p ~/ktb-frontend && cd ~/ktb-frontend
              docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
              OLD=$(docker ps -q -f name=ktb-frontend) || true
              docker stop ktb-frontend 2>/dev/null || true
              docker rm ktb-frontend 2>/dev/null || true
              docker run -d --name ktb-frontend --restart unless-stopped \
                -p 3000:3000 \
                -e NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL}" \
                -e NEXT_PUBLIC_SOCKET_URL="${NEXT_PUBLIC_SOCKET_URL}" \
                --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
                ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
              sleep 10
              for i in {1..30}; do
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || echo "000")
                if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
                  docker image prune -af --filter "until=72h" || true
                  echo "✅ Deployed"
                  exit 0
                fi
                sleep 2
              done
              docker stop ktb-frontend && docker rm ktb-frontend
              [ ! -z "$OLD" ] && docker start $OLD || true
              exit 1
          ENDSSH
            then
              echo "✅ Success"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "❌ Failed"
            fi

            [ $i -lt $((TOTAL - 1)) ] && sleep 10
          done

          echo ""
          echo "📊 Result: $SUCCESS/$TOTAL succeeded"
          [ $SUCCESS -eq $TOTAL ] && echo "🎉 All deployed!" || exit 1

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
