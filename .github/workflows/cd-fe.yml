name: CD Frontend

on:
  push:
    branches:
      - deploy
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/cd-fe.yml'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: ktb-bootcamp-chat-frontend
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}

concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: vars
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "🏷️ Version: ${SHORT_SHA}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 instances from Target Group
        id: get-instances
        run: |
          echo "🔍 Fetching instances from Target Group: ${{ secrets.FRONTEND_TARGET_GROUP_NAME }}"
          echo "ℹ️  Including ALL instances regardless of health status"

          # Get Target Group ARN
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names ${{ secrets.FRONTEND_TARGET_GROUP_NAME }} \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)

          echo "📋 Target Group ARN: $TG_ARN"

          # Get all targets (no health filter - AWS returns all by default)
          echo ""
          echo "📊 Fetching all targets with health status..."

          # Get instance IDs (all health states)
          INSTANCE_IDS=$(aws elbv2 describe-target-health \
            --target-group-arn $TG_ARN \
            --query 'TargetHealthDescriptions[].Target.Id' \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "❌ No instances found in Target Group"
            exit 1
          fi

          # Show detailed health status using AWS CLI query
          echo "Health Status Details:"
          aws elbv2 describe-target-health \
            --target-group-arn $TG_ARN \
            --query 'TargetHealthDescriptions[].[Target.Id, TargetHealth.State, TargetHealth.Reason]' \
            --output table

          # Get public IPs
          PUBLIC_IPS=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_IDS \
            --query 'Reservations[].Instances[].PublicIpAddress' \
            --output text)

          # Count instances by health status
          TOTAL_COUNT=$(echo $INSTANCE_IDS | wc -w | tr -d ' ')
          HEALTHY_COUNT=$(aws elbv2 describe-target-health \
            --target-group-arn $TG_ARN \
            --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' \
            --output text)
          UNHEALTHY_COUNT=$(aws elbv2 describe-target-health \
            --target-group-arn $TG_ARN \
            --query 'length(TargetHealthDescriptions[?TargetHealth.State==`unhealthy`])' \
            --output text)

          echo ""
          echo "✅ Found $TOTAL_COUNT total instances:"
          echo "   - Healthy: $HEALTHY_COUNT"
          echo "   - Unhealthy: $UNHEALTHY_COUNT"
          echo "   - Other: $((TOTAL_COUNT - HEALTHY_COUNT - UNHEALTHY_COUNT))"
          echo ""
          echo "Instance IDs: $INSTANCE_IDS"
          echo "Public IPs: $PUBLIC_IPS"

          echo "instance-ips=$PUBLIC_IPS" >> $GITHUB_OUTPUT
          echo "instance-ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
          echo "tg-arn=$TG_ARN" >> $GITHUB_OUTPUT

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 400 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile /dev/null
          EOF

      - name: Deploy to EC2 instances
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.short-sha }}
          SSH_USER: ${{ secrets.EC2_SSH_USER }}
          INSTANCE_IPS: ${{ steps.get-instances.outputs.instance-ips }}
          INSTANCE_IDS: ${{ steps.get-instances.outputs.instance-ids }}
          TG_ARN: ${{ steps.get-instances.outputs.tg-arn }}
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ env.NEXT_PUBLIC_SOCKET_URL }}
        run: |
          echo "🚀 Starting deployment..."

          IPS=($INSTANCE_IPS)
          IDS=($INSTANCE_IDS)
          TOTAL=${#IPS[@]}
          SUCCESS=0

          for i in "${!IPS[@]}"; do
            IP=${IPS[$i]}
            ID=${IDS[$i]}

            echo ""
            echo "📦 Instance $((i+1))/$TOTAL: $ID ($IP)"

            if ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 ${SSH_USER}@${IP} \
              DOCKER_IMAGE="${DOCKER_USERNAME}/${IMAGE_NAME}:latest" \
              API_URL="${NEXT_PUBLIC_API_URL}" \
              SOCKET_URL="${NEXT_PUBLIC_SOCKET_URL}" \
              bash << 'ENDSSH'
              set -e
              mkdir -p ~/ktb-frontend && cd ~/ktb-frontend

              # 환경변수 파일 생성
              echo "⚙️  Creating environment file..."
              ENV_FILE=".env.production"
              cat > $ENV_FILE << EOF
              # Frontend Environment Variables
              NEXT_PUBLIC_API_URL=$API_URL
              NEXT_PUBLIC_SOCKET_URL=$SOCKET_URL
              NODE_ENV=production
              PORT=3000
              EOF

              echo "✅ Environment file created:"
              cat $ENV_FILE

              echo "📦 Pulling image: $DOCKER_IMAGE"
              docker pull "$DOCKER_IMAGE"

              OLD=$(docker ps -q -f name=ktb-frontend) || true
              docker stop ktb-frontend 2>/dev/null || true
              docker rm ktb-frontend 2>/dev/null || true

              echo "🚀 Starting container with image: $DOCKER_IMAGE"
              docker run -d --name ktb-frontend --restart unless-stopped \
                -p 3000:3000 \
                --env-file $ENV_FILE \
                --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
                "$DOCKER_IMAGE"

              sleep 10
              for i in {1..30}; do
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || echo "000")
                if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
                  docker image prune -af --filter "until=72h" || true
                  echo "✅ Deployed"
                  exit 0
                fi
                sleep 2
              done
              docker stop ktb-frontend && docker rm ktb-frontend
              [ ! -z "$OLD" ] && docker start $OLD || true
              exit 1
          ENDSSH
            then
              echo "✅ Success"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "❌ Failed"
            fi

            [ $i -lt $((TOTAL - 1)) ] && sleep 10
          done

          echo ""
          echo "📊 Result: $SUCCESS/$TOTAL succeeded"
          [ $SUCCESS -eq $TOTAL ] && echo "🎉 All deployed!" || exit 1

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
